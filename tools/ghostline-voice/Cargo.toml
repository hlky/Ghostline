[package]
name = "ghostline-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
dinoml-qwen3-tts = { git = "https://github.com/hlky/dinoml_v2", rev = "3cd3f16fd30bc21d884faf4b16a376edb3cfc40a" }
dinoml-runtime = { git = "https://github.com/hlky/dinoml_v2", rev = "3cd3f16fd30bc21d884faf4b16a376edb3cfc40a" }
ghostline-red = { path = "../ghostline-red" }
half = "2.7"
safetensors = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[bin]]
name = "ghostline-voice"
path = "src/main.rs"
