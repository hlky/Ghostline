[package]
name = "ghostline-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["render-local"]
render-local = ["dep:dinoml-qwen3-tts", "dep:dinoml-runtime", "dep:half", "dep:safetensors", "dep:sha2"]

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
dinoml-qwen3-tts = { optional = true, git = "https://github.com/hlky/dinoml_v2", rev = "3cd3f16fd30bc21d884faf4b16a376edb3cfc40a" }
dinoml-runtime = { optional = true, git = "https://github.com/hlky/dinoml_v2", rev = "3cd3f16fd30bc21d884faf4b16a376edb3cfc40a" }
ghostline-red = { path = "../ghostline-red" }
half = { version = "2.7", optional = true }
safetensors = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[bin]]
name = "ghostline-voice"
path = "src/main.rs"
