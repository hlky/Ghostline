  $base: Items.sts_std_rcr_05_datachip
  friendlyName: GhostlineBlackLanternRouteAuth
  localizedName: gl_gq003_item_route_auth_name

Items.GhostlineBlackLanternRouteBeacon:
  $base: Items.sts_std_rcr_05_datachip
  friendlyName: GhostlineBlackLanternRouteBeacon
  localizedName: gl_gq003_item_route_beacon_name

# The expedited-handoff clue is a readable shard. Its title and body live in
