  effectors:
    - Effectors.HitReactionTBHIncrease
  tags:
    - Cyberpsycho
  visualTags:
    - Netrunner
    - Lvl3
  statModifierGroups:
    - Character.NPC_Base_Primary_Stat_ModGroup
    - Character.Cyberpsycho_ModGroup
    - Character.Cyberpsycho_HitReaction_Resistance
    - Character.GhostlineGothBaddie_BossStatModifiers
  contentAssignment: Character.GhostlineGothBaddie_FixedLevelContent
  primaryEquipment: Character.GhostlineGothBaddie_PrimaryEquipment

Character.GhostlineGothBaddie_FixedLevel:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.PowerLevel
  modifierType: Additive
  value: 60

Character.GhostlineGothBaddie_FixedLevelContent:
  $type: gamedataDeviceContentAssignment_Record
  powerLevelMod: Character.GhostlineGothBaddie_FixedLevel

Character.GhostlineGothBaddie_HealthMultiplier:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.Health
  modifierType: Multiplier
  value: 10.0

Character.GhostlineGothBaddie_BossStatModifiers:
  $type: gamedataStatModifierGroup_Record
  statModifiers:
    - Character.GhostlineGothBaddie_HealthMultiplier

Character.GhostlineGothBaddie_PrimaryEquipment:
  $type: gamedataNPCEquipmentGroup_Record
  equipmentItems:
    - Character.GhostlineGothBaddie_PrimaryWeapon

Character.GhostlineGothBaddie_PrimaryWeapon:
  $type: gamedataNPCEquipmentItem_Record
  item: Items.Preset_Katana_E3
  equipSlot: AttachmentSlots.WeaponRight
  onBodySlot: AttachmentSlots.ItemSlotKatana
  equipCondition:
    - WeaponConditions.BaseMeleePrimaryWeaponEquipCondition
  unequipCondition:
    - WeaponConditions.BaseMeleePrimaryWeaponUnequipCondition
